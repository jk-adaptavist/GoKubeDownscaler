name: Build and push Image

on:
  workflow_call:
    inputs:
      appVersion:
        required: true
        type: string
      setLatest:
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/jk-adaptavist/gokubedownscaler
          tags: |
            ${{ inputs.setLatest && 'latest' || '' }}
            ${{ inputs.appVersion }}

      - name: Docker meta webhook
        id: meta-webhook
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/jk-adaptavist/gokubedownscaler-webhook
          tags: |
            ${{ inputs.setLatest && 'latest' || '' }}
            ${{ inputs.appVersion }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        id: build-push
        with:
          context: .
          file: ./build/kubedownscaler/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Build and push webhook
        uses: docker/build-push-action@v7
        id: build-push-webhook
        with:
          context: .
          file: ./build/admissioncontroller/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-webhook.outputs.tags }}
