name: Build and push helm chart

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      appVersion:
        required: true
        type: string

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Log in to Helm OCI Registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Helm Lint, Package, and Push
        run: |
          cd deployments/chart
          helm lint .
          helm package . --version ${{ inputs.version }} --app-version ${{ inputs.appVersion }}
          helm push $(ls *.tgz | head -1) oci://ghcr.io/jk-adaptavist/charts
